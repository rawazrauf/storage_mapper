<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Storage Mapper — Authenticating…</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #030712; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; }
.box { text-align: center; padding: 24px; }
.icon { font-size: 48px; margin-bottom: 16px; }
h1 { font-size: 16px; font-weight: 700; color: #f59e0b; margin-bottom: 8px; }
p { font-size: 12px; color: #6b7280; line-height: 1.5; }
a { color: #f59e0b; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔑</div>
  <h1 id="status">Completing authentication…</h1>
  <p id="detail">Please wait</p>
</div>
<script>
// The app page (index.html) sets this so the callback knows to bounce back to
// it for the same-tab (redirect) flow instead of trying to close a popup.
const APP_URL = 'https://rawazrauf.github.io/storage_mapper/';

const params = new URLSearchParams(window.location.search);
const code   = params.get('code');
const state  = params.get('state');
const error  = params.get('error');

const statusEl = document.getElementById('status');
const detailEl = document.getElementById('detail');

// Detect flow: in the popup flow we have an opener we can talk to and close.
// In the same-tab flow, window.opener is null and we must redirect back.
const isPopup = !!(window.opener && window.opener !== window);
const sameTabPending = localStorage.getItem('sm_oauth_sametab') === '1';

function finish(resultObj) {
  // Always write the result so the popup poller (or the app on reload) can read it.
  try { localStorage.setItem('osm_oauth_result', JSON.stringify(resultObj)); } catch (e) {}

  if (isPopup && !sameTabPending) {
    // Popup flow: opener is polling localStorage. Close ourselves.
    statusEl.textContent = resultObj.error ? 'Authentication cancelled' : 'Authenticated ✓';
    detailEl.textContent = resultObj.error ? (resultObj.error) : 'You can close this window';
    setTimeout(() => { try { window.close(); } catch (e) {} }, 1200);
    // Fallback: if the window did not close (common on iOS), offer a link back.
    setTimeout(() => {
      detailEl.innerHTML = 'You can close this window, or <a href="' + APP_URL + '">return to Storage Mapper</a>.';
    }, 1600);
  } else {
    // Same-tab flow: redirect back to the app, which completes login on load.
    // Pass the result in the URL hash too, as a fallback in case localStorage
    // doesn't survive the navigation on some in-app browsers. The hash is not
    // sent to any server; the app reads and immediately clears it.
    statusEl.textContent = resultObj.error ? 'Authentication cancelled' : 'Authenticated ✓';
    detailEl.textContent = 'Returning to Storage Mapper…';
    const hash = '#osm_auth=' + encodeURIComponent(JSON.stringify(resultObj));
    setTimeout(() => { window.location.replace(APP_URL + hash); }, 500);
  }
}

if (error) {
  finish({ error });
} else if (code) {
  finish({ code, state });
} else {
  statusEl.textContent = 'No code received';
  detailEl.innerHTML = 'Please <a href="' + APP_URL + '">return to Storage Mapper</a> and try again.';
}
</script>
</body>
</html>
